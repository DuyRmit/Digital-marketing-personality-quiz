<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>What’s your digital marketing superpower?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #000054;
        --navy-2: #0d0d6b;
        --red: #e61e2a;
        --gold: #fac800;
        --paper: #ffffff;
        --mist: #eef0fb;
        --line: #c9cdee;
        --text: #12123a;
        --accent: #e61e2a;
        --accent-ink: #ffffff;
        --radius: 18px;
        --font: 'Lato', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family: var(--font);
        color: var(--text);
        background: #f1f2fb;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      .shell {
        max-width: 960px;
        margin: 0 auto;
        padding: 20px 16px 40px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--navy);
        padding: 4px 2px 16px;
      }
      .brand {
        font-weight: 900;
        font-size: 0.95rem;
        letter-spacing: 0.01em;
      }
      .brand span {
        color: var(--red);
      }
      .progress {
        display: flex;
        gap: 2px;
        align-items: center;
      }
      .pstep {
        display: block;
        border: 0;
        background: none;
        padding: 12px 3px;
        margin: 0;
        font: inherit;
      }
      .pstep i {
        width: 26px;
        height: 6px;
        border-radius: 99px;
        background: var(--line);
        display: block;
        transition: background 0.2s;
      }
      .pstep.done i {
        background: var(--navy);
      }
      .pstep.now i {
        background: var(--red);
      }
      button.pstep {
        cursor: pointer;
      }
      button.pstep:hover i {
        background: var(--red);
      }
      button.pstep:focus-visible {
        outline: 3px solid var(--navy);
        outline-offset: 1px;
        border-radius: 8px;
      }
      .progress[hidden] {
        display: none;
      }
      main {
        flex: 1;
        display: flex;
      }
      .card {
        background: var(--paper);
        border-radius: 28px;
        padding: 24px 20px 28px;
        width: 100%;
        border: 1px solid var(--line);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
        align-self: flex-start;
        --cardpad: 20px;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        line-height: 1.1;
        color: var(--navy);
      }
      h1 {
        font-size: clamp(2rem, 7vw, 3.6rem);
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: clamp(1.5rem, 4.6vw, 2.2rem);
        font-weight: 900;
        letter-spacing: -0.01em;
      }
      h1:focus,
      h2:focus {
        outline: none;
      }
      p {
        margin: 0;
      }
      .lead {
        font-size: 1.1rem;
        margin-top: 14px;
        max-width: 46ch;
      }
      .note {
        font-size: 0.95rem;
        color: #4a4a78;
        margin-top: 10px;
        max-width: 50ch;
      }
      .kicker {
        display: inline-block;
        background: var(--mist);
        color: var(--navy);
        font-weight: 700;
        font-size: 0.9rem;
        padding: 5px 12px;
        border-radius: 99px;
        margin-bottom: 14px;
      }
      .scenario {
        font-size: 1.15rem;
        margin-top: 10px;
        max-width: 50ch;
      }

      /* welcome */
      .welcome {
        display: grid;
        gap: 22px;
        grid-template-areas: 'intro' 'cards' 'go';
      }
      .w-intro {
        grid-area: intro;
      }
      .w-go {
        grid-area: go;
      }
      .w-go .note {
        margin-top: 0;
      }
      .w-go .actions {
        margin-top: 14px;
      }
      /* persona gallery: swipe on phones, 2x3 grid on laptops */
      .pwrap {
        grid-area: cards;
        min-width: 0;
      }
      .pgrid {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        margin: 0 calc(var(--cardpad) * -1);
        padding: 8px var(--cardpad) 16px;
        scroll-padding-inline: var(--cardpad);
        list-style: none;
        scrollbar-width: none;
        overscroll-behavior-x: contain;
      }
      .pgrid::-webkit-scrollbar {
        display: none;
      }
      .pgrid:focus-visible {
        outline: 4px solid var(--gold);
        outline-offset: -4px;
        border-radius: 20px;
      }
      .pcard {
        flex: 0 0 78%;
        max-width: 300px;
        scroll-snap-align: start;
        background: var(--c);
        color: var(--ink);
        border-radius: 26px;
        padding: 24px 18px 26px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 12px;
        transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .pcard:not(.is-active) {
        transform: scale(0.93);
      }
      .pcard .pic {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        display: grid;
        place-items: center;
        font-size: 3.6rem;
        overflow: hidden;
        flex: none;
      }
      .pcard .pic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .pcard h3 {
        color: inherit;
        font-size: 1.35rem;
        font-weight: 900;
        line-height: 1.15;
      }
      .pcard p {
        font-size: 0.98rem;
        line-height: 1.4;
      }
      .pdots {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 2px;
      }
      .pdots span {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--line);
        transition:
          width 0.3s,
          background 0.3s;
      }
      .pdots span.on {
        width: 26px;
        background: var(--navy);
      }
      .swipe-hint {
        text-align: center;
        font-size: 0.9rem;
        color: #4a4a78;
        margin-top: 8px;
      }

      /* entrance motion */
      @keyframes rise {
        from {
          opacity: 0;
          translate: 0 20px;
        }
        to {
          opacity: 1;
          translate: 0 0;
        }
      }
      @keyframes pop {
        0% {
          transform: scale(0.4);
          opacity: 0;
        }
        70% {
          transform: scale(1.08);
          opacity: 1;
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes tick {
        0% {
          transform: scale(0.7);
        }
        60% {
          transform: scale(1.18);
        }
        100% {
          transform: scale(1);
        }
      }
      .in {
        animation: rise 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
        animation-delay: calc(var(--i, 0) * 70ms);
      }
      .hero .badge {
        animation: pop 0.75s cubic-bezier(0.3, 1.4, 0.5, 1) 0.3s backwards;
      }
      .opt input:checked + label .letter {
        animation: tick 0.3s ease-out;
      }

      /* answers */
      fieldset {
        border: 0;
        margin: 20px 0 0;
        padding: 0;
        min-width: 0;
      }
      legend {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      .opts {
        display: grid;
        gap: 10px;
      }
      .opt {
        position: relative;
      }
      .opt input {
        position: absolute;
        opacity: 0;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        cursor: pointer;
        z-index: 2;
      }
      .opt label {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 60px;
        padding: 12px 16px 12px 12px;
        border: 2px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--navy);
        transition:
          border-color 0.15s,
          background 0.15s,
          transform 0.15s;
      }
      .opt .letter {
        flex: none;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: var(--mist);
        display: grid;
        place-items: center;
        font-weight: 900;
        color: var(--navy);
      }
      .opt input:hover + label {
        border-color: var(--navy);
      }
      .opt input:checked + label {
        border-color: var(--navy);
        background: var(--navy);
        color: #fff;
      }
      .opt input:checked + label .letter {
        background: var(--gold);
        color: var(--navy);
      }
      .opt input:checked + label::after {
        content: '✓';
        margin-left: auto;
        font-weight: 900;
        color: var(--gold);
        font-size: 1.3rem;
      }
      .opt input:focus-visible + label {
        outline: 4px solid var(--gold);
        outline-offset: 2px;
        box-shadow: 0 0 0 2px var(--navy);
      }

      /* buttons */
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .btn {
        font: inherit;
        font-weight: 900;
        font-size: 1.05rem;
        border: 0;
        border-radius: 99px;
        padding: 15px 28px;
        min-height: 52px;
        cursor: pointer;
        background: var(--red);
        color: #fff;
        transition:
          transform 0.12s,
          background 0.15s;
      }
      .btn:hover:not(:disabled) {
        transform: translateY(-1px);
        background: #c8101c;
      }
      .btn:focus-visible {
        outline: 4px solid var(--gold);
        outline-offset: 3px;
      }
      .btn:disabled {
        background: #d6d8ee;
        color: #7b7ca8;
        cursor: not-allowed;
      }
      .btn.ghost {
        background: transparent;
        color: var(--navy);
        box-shadow: inset 0 0 0 2px var(--navy);
      }
      .btn.ghost:hover:not(:disabled) {
        background: var(--mist);
      }
      .btn.gold {
        background: var(--gold);
        color: var(--navy);
      }
      .btn.gold:hover:not(:disabled) {
        background: #e6b800;
      }
      .actions .grow {
        flex: 1 1 220px;
      }

      /* calc */
      .calc {
        text-align: center;
        padding: 48px 8px;
      }
      .spinner {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 6px solid var(--mist);
        border-top-color: var(--red);
        margin: 0 auto 22px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* result */
      .reveal {
        display: grid;
        gap: 22px;
      }
      .hero {
        background: var(--accent);
        color: var(--accent-ink);
        border-radius: 24px;
        padding: 26px 20px;
        display: grid;
        gap: 18px;
        justify-items: center;
        text-align: center;
      }
      .badge {
        width: min(220px, 56vw);
        aspect-ratio: 1;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        display: grid;
        place-items: center;
        font-size: clamp(4.5rem, 22vw, 7.5rem);
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .badge img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .hero h2 {
        color: inherit;
        font-size: clamp(2.2rem, 9vw, 3.6rem);
      }
      .value {
        display: inline-block;
        margin-top: 10px;
        font-weight: 900;
        font-size: 1.05rem;
        background: rgba(255, 255, 255, 0.92);
        color: var(--navy);
        padding: 6px 16px;
        border-radius: 99px;
      }
      .power {
        font-size: 1.3rem;
        font-weight: 700;
        max-width: 30ch;
        line-height: 1.3;
      }
      .action-box h3 {
        font-size: 1.3rem;
      }
      .action-box p {
        margin-top: 8px;
      }
      .action-box .ask {
        font-weight: 700;
        color: var(--navy);
      }
      .invite {
        background: var(--mist);
        border-radius: 22px;
        padding: 20px;
      }
      .invite h3 {
        font-size: 1.25rem;
      }
      .invite p {
        margin-top: 8px;
      }
      /* post + shared board */
      .next-step {
        display: block;
        margin-top: 14px;
        font-weight: 900;
        color: var(--navy);
        font-size: 1.05rem;
      }
      #stepText {
        display: block;
        width: 100%;
        margin-top: 8px;
        font: inherit;
        font-size: 1rem;
        line-height: 1.4;
        padding: 14px 16px;
        border: 2px dashed var(--navy);
        border-radius: 16px;
        background: #fff;
        color: var(--text);
        resize: vertical;
        min-height: 96px;
      }
      #stepText:focus-visible {
        outline: 4px solid var(--gold);
        outline-offset: 2px;
        border-style: solid;
      }
      .count {
        text-align: right;
        font-size: 0.85rem;
        color: #4a4a78;
        margin-top: 4px;
      }
      .err {
        color: #b00613;
        font-weight: 700;
        min-height: 1.2em;
      }
      .posted {
        margin-top: 14px;
        background: #fff;
        border-radius: 16px;
        padding: 14px 16px;
        border: 2px solid var(--navy);
      }
      .demo {
        background: #fff6d1;
        border: 1px solid var(--gold);
        border-radius: 12px;
        padding: 8px 12px;
      }
      .board {
        column-width: 240px;
        column-gap: 14px;
        margin-top: 20px;
      }
      .pnote {
        break-inside: avoid;
        margin: 0 0 14px;
        background: #fff;
        border: 2px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        position: relative;
      }
      .pnote header {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--c);
        color: var(--ink);
        padding: 10px 12px;
        font-weight: 900;
      }
      .pnote header em {
        margin-left: auto;
        font-style: normal;
        font-size: 0.8rem;
        background: rgba(255, 255, 255, 0.92);
        color: var(--navy);
        padding: 2px 10px;
        border-radius: 99px;
      }
      .pn-ic {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        display: grid;
        place-items: center;
        font-size: 1.2rem;
        overflow: hidden;
        flex: none;
      }
      .pn-ic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .pnote p {
        padding: 14px 14px 16px;
        font-size: 1.02rem;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .pn-v {
        width: fit-content;
        margin: -4px 14px 14px;
        padding: 3px 12px;
        border-radius: 99px;
        background: var(--c);
        color: var(--ink);
        font-size: 0.85rem;
        font-weight: 900;
      }
      .pnote.mine {
        border-color: var(--navy);
        box-shadow: 0 0 0 3px var(--gold);
      }
      .pnote .hide {
        position: absolute;
        right: 8px;
        bottom: 8px;
        font: inherit;
        font-size: 0.8rem;
        font-weight: 700;
        border: 1px solid #b00613;
        color: #b00613;
        background: #fff;
        border-radius: 99px;
        padding: 4px 12px;
        cursor: pointer;
      }
      .empty {
        margin-top: 20px;
        text-align: center;
        padding: 36px 12px;
        background: var(--mist);
        border-radius: 18px;
        font-weight: 700;
        color: var(--navy);
      }
      /* floating arrival: new cards rise from below and settle; on the big screen they keep a gentle drift */
      @keyframes floatIn {
        0% {
          opacity: 0;
          translate: 0 140px;
          scale: 0.9;
        }
        55% {
          opacity: 1;
        }
        100% {
          opacity: 1;
          translate: 0 0;
          scale: 1;
        }
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      .pnote.float {
        animation: floatIn 1.2s cubic-bezier(0.22, 1.25, 0.36, 1) backwards;
        animation-delay: calc(var(--i, 0) * 120ms);
      }
      .kiosk .pnote {
        animation: bob 7s ease-in-out infinite;
        animation-delay: var(--b, 0s);
      }
      .kiosk .pnote.float {
        animation:
          floatIn 1.2s cubic-bezier(0.22, 1.25, 0.36, 1) backwards,
          bob 7s ease-in-out infinite;
        animation-delay: calc(var(--i, 0) * 120ms), var(--b, 0s);
      }
      .pn-t {
        display: flex;
        flex-direction: column;
        line-height: 1.15;
        min-width: 0;
      }
      .pn-t b {
        overflow-wrap: anywhere;
      }
      .pn-t small {
        font-weight: 700;
        opacity: 0.9;
        font-size: 0.78rem;
      }
      .field-label {
        display: block;
        margin-top: 14px;
        font-weight: 700;
        color: var(--navy);
      }
      #stepName {
        display: block;
        width: 100%;
        max-width: 320px;
        margin-top: 6px;
        font: inherit;
        font-size: 1rem;
        padding: 12px 14px;
        border: 2px solid var(--line);
        border-radius: 14px;
        background: #fff;
        color: var(--text);
      }
      #stepName:focus-visible {
        outline: 4px solid var(--gold);
        outline-offset: 2px;
        border-color: var(--navy);
      }

      /* ===== Big-screen mode (#board): full bleed, animated background, type scales with the screen ===== */
      html.kiosk {
        font-size: clamp(16px, 1.05vw, 40px);
      }
      body.kiosk {
        background: #000;
        overflow: hidden;
      }
      .kiosk .topbar,
      .kiosk .progress {
        display: none;
      }
      .kiosk .shell {
        position: relative;
        z-index: 1;
        max-width: none;
        height: 100vh;
        min-height: 0;
        padding: 3.2vh 3.2vw;
      }
      .kiosk main {
        min-height: 0;
      }
      .kiosk .card {
        background: transparent;
        border: 0;
        box-shadow: none;
        border-radius: 0;
        padding: 0;
        align-self: stretch;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .kiosk h2 {
        color: #fff;
        font-size: 2.7rem;
        letter-spacing: -0.02em;
      }
      .kiosk .lead {
        color: rgba(255, 255, 255, 0.88);
        font-size: 1.5rem;
        margin-top: 0.5rem;
        max-width: none;
      }
      .kiosk .note {
        color: rgba(255, 255, 255, 0.75);
      }
      .kiosk .demo {
        background: #fff6d1;
        color: #12123a;
      }
      .khead {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 2rem;
      }
      .kbrand {
        color: var(--gold);
        font-weight: 900;
        font-size: 1.1rem;
        letter-spacing: 0.04em;
        margin-bottom: 0.4rem;
      }
      .kjoin {
        flex: none;
        display: flex;
        align-items: center;
        gap: 1.3rem;
        text-align: right;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.28);
        border-radius: 1.2rem;
        padding: 0.8rem 0.8rem 0.8rem 1.6rem;
        color: #fff;
      }
      .kjoin span {
        display: block;
        font-size: 1.1rem;
        opacity: 0.9;
      }
      .kjoin b {
        display: block;
        font-size: 1.9rem;
        line-height: 1.1;
        color: var(--gold);
        margin-bottom: 0.25rem;
      }
      .kjoin .note {
        margin: 0.3rem 0 0;
        font-size: 0.9rem;
      }
      .kqr {
        display: block;
        flex: none;
        width: 9.5rem;
        height: 9.5rem;
        border-radius: 0.8rem;
        background: #fff;
      }
      /* TV cards are the same as the student cards: height follows the text, nothing is cut off.
         JS picks the fewest columns that still fit every card on screen and sets --cw (column
         width); text and icons scale with it. */
      .kiosk .board {
        display: block;
        column-count: 4;
        column-width: auto;
        column-gap: var(--gap, 14px);
        column-fill: auto;
        overflow: hidden;
        margin: 1.2rem -0.7rem 0;
        padding: 0.7rem;
      }
      .kiosk .pnote {
        margin: 0 0 var(--gap, 14px);
        border: 0;
        border-radius: calc(var(--cw, 300px) * 0.06);
        box-shadow: 0 0.35rem 1.2rem rgba(0, 0, 20, 0.45);
        font-size: calc(var(--cw, 300px) * 0.065);
      }
      .kiosk .board.measuring .pnote {
        translate: none !important;
        scale: none !important;
        transform: none !important;
      }
      .kiosk .pnote header {
        padding: 0.6em 0.75em;
        gap: 0.6em;
        font-size: 1em;
      }
      .kiosk .pn-ic {
        width: 2.3em;
        height: 2.3em;
        font-size: 1.1em;
      }
      .kiosk .pn-t small {
        font-size: 0.8em;
      }
      .kiosk .pnote p {
        padding: 0.7em 0.8em 0.5em;
        font-size: 1em;
        line-height: 1.35;
      }
      .kiosk .pn-v {
        margin: 0 0.8em 0.75em;
        padding: 0.15em 0.8em;
        font-size: 0.85em;
      }
      .kiosk .pn-vl {
        display: none;
      }
      .kiosk .empty {
        grid-column: 1 / -1;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font-size: 2rem;
        padding: 4rem 2rem;
        border-radius: 1.5rem;
      }
      .kfs {
        position: fixed;
        right: 1.2rem;
        bottom: 1.2rem;
        z-index: 5;
        font: inherit;
        font-size: 1rem;
        font-weight: 900;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid rgba(255, 255, 255, 0.55);
        border-radius: 99px;
        padding: 0.6em 1.3em;
        cursor: pointer;
        transition: opacity 0.4s;
      }
      .kfs:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .kclear {
        position: fixed;
        left: 1.2rem;
        bottom: 1.2rem;
        z-index: 5;
        font: inherit;
        font-size: 1rem;
        font-weight: 900;
        color: #fff;
        background: rgba(176, 6, 19, 0.85);
        border: 2px solid rgba(255, 255, 255, 0.55);
        border-radius: 99px;
        padding: 0.6em 1.3em;
        cursor: pointer;
      }
      .kclear:hover {
        background: #b00613;
      }
      .kclear:focus-visible {
        outline: 4px solid var(--gold);
        outline-offset: 3px;
      }
      .kfs:focus-visible {
        outline: 4px solid var(--gold);
        outline-offset: 3px;
      }
      .kfs[hidden] {
        display: none;
      }
      .kiosk.idle .kfs {
        opacity: 0;
        pointer-events: none;
      }
      .kiosk.idle,
      .kiosk.idle * {
        cursor: none;
      }
      @keyframes glow {
        0% {
          box-shadow: 0 0 0 0 rgba(250, 200, 0, 0.95);
        }
        100% {
          box-shadow: 0 0 0 1.8rem rgba(250, 200, 0, 0);
        }
      }
      .kiosk .pnote.fresh {
        animation:
          floatIn 1.2s cubic-bezier(0.22, 1.25, 0.36, 1) backwards,
          glow 1.8s ease-out 1.1s,
          bob 7s ease-in-out infinite;
        animation-delay: calc(var(--i, 0) * 120ms), calc(var(--i, 0) * 120ms + 1.1s), var(--b, 0s);
      }

      /* moving background: a slow flight through a starfield tunnel (drawn on a canvas by startStarfield) */
      .kbg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: #000;
      }
      .kbg canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .kbg::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0) 45%,
          rgba(0, 0, 0, 0.55) 100%
        );
      }
      .save-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .finish {
        text-align: left;
      }
      .finish .big {
        font-size: 4rem;
        line-height: 1;
        margin-bottom: 12px;
      }

      /* desktop */
      @media (min-width: 820px) {
        .shell {
          padding: 28px 32px 56px;
        }
        .card {
          padding: 44px 52px 48px;
        }
        .opts {
          grid-template-columns: 1fr 1fr;
          gap: 12px;
        }
        .opt label {
          min-height: 76px;
        }
        .hero {
          grid-template-columns: 240px 1fr;
          text-align: left;
          justify-items: start;
          align-items: center;
          padding: 32px 36px;
          gap: 32px;
        }
        .badge {
          width: 240px;
        }
        .reveal {
          grid-template-columns: 1fr 1fr;
          align-items: start;
        }
        .reveal .hero {
          grid-column: 1 / -1;
        }
        .tie .opts {
          grid-template-columns: 1fr 1fr;
        }
        .welcome {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
          grid-template-areas: 'intro cards' 'go cards';
          grid-template-rows: auto 1fr;
          column-gap: 44px;
          align-items: start;
        }
        .w-go {
          align-self: end;
        }
        .pgrid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 14px;
          overflow: visible;
          margin: 0;
          padding: 0;
          scroll-snap-type: none;
        }
        .pcard {
          flex: none;
          max-width: none;
          padding: 20px 18px 22px;
          gap: 10px;
        }
        .pcard:not(.is-active) {
          transform: none;
        }
        .pcard .pic {
          width: 96px;
          height: 96px;
          font-size: 3.2rem;
        }
        .pcard h3 {
          font-size: 1.2rem;
        }
        .pcard p {
          font-size: 0.92rem;
        }
        .pdots,
        .swipe-hint {
          display: none;
        }
      }
      @media (max-width: 380px) {
        .progress i {
          width: 18px;
        }
        .card {
          padding: 20px 14px 24px;
          --cardpad: 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
        .in,
        .hero .badge,
        .opt input:checked + label .letter,
        .pnote,
        .pnote.float,
        .pnote.fresh {
          animation: none !important;
        }
        .pgrid {
          scroll-behavior: auto;
        }
        .spinner {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div class="brand">RMIT <span>Digital Marketing</span></div>
        <div class="progress" id="progress" hidden aria-label="Quiz progress"></div>
      </div>
      <main><section class="card" id="stage"></section></main>
    </div>

    <script>
      /* =========================================================
   CONFIG — edit copy, personas and images here
   ========================================================= */

      /* Persona assets: when the final icons are ready, set `image` to a file path or URL
   (e.g. 'img/creator.png'). Until then the emoji is used as a placeholder.
   Icons are also drawn onto the downloadable result card. */
      const PERSONAS = {
        creator: {
          name: 'Creator',
          emoji: '✨',
          image: '',
          value: 'Imagination',
          power: 'Turn imaginative ideas into shareable stories.',
          blurb:
            'You turn bold ideas into eye-catching stories, videos and trends that people love to watch, share and talk about.',
          head: 'Ready to bring your ideas to life?',
          desc: 'You have the power to turn a fresh idea into creative content that captures attention and gets people talking.',
          ask: 'What’s one idea you could turn into something people will want to share?',
          color: '#E61E2A',
          ink: '#ffffff',
        },
        inclusive: {
          name: 'Inclusive Marketer',
          emoji: '🤝',
          image: '',
          value: 'Inclusion',
          power: 'Connect different voices and build welcoming communities.',
          blurb:
            'You bring people together, listen to different voices and build online communities where everyone feels welcome, seen and heard.',
          head: 'Ready to make everyone feel included?',
          desc: 'You can create campaigns that welcome different perspectives and help more people feel seen and heard.',
          ask: 'How could you make your next project more inclusive?',
          color: '#0E7C5A',
          ink: '#ffffff',
        },
        trust: {
          name: 'Trust Builder',
          emoji: '🔒',
          image: '',
          value: 'Integrity',
          power: 'Earn trust through honesty and transparency.',
          blurb:
            'You communicate honestly and openly, earning audience loyalty and helping people make choices they feel confident about.',
          head: 'Ready to build trust?',
          desc: 'You can create stronger relationships by communicating honestly and helping people make informed choices.',
          ask: 'How could you make your next message more transparent?',
          color: '#2F5DFF',
          ink: '#ffffff',
        },
        explorer: {
          name: 'Explorer',
          emoji: '🚀',
          image: '',
          value: 'Courage',
          power: 'Experiment with new ideas and digital tools.',
          blurb:
            'You love testing new ideas, AI and digital tools, and you’re not afraid to try something no one has done.',
          head: 'Ready to try something new?',
          desc: 'You can explore emerging tools, test bold ideas and discover new ways to connect with audiences.',
          ask: 'What new tool or idea could you experiment with this week?',
          color: '#7B3FE4',
          ink: '#ffffff',
        },
        strategist: {
          name: 'Strategist',
          emoji: '🧠',
          image: '',
          value: 'Passion',
          power: 'Pursue marketing goals with research and planning.',
          blurb:
            'You dig into data and audience insights, then use research and smart planning to hit your campaign goals.',
          head: 'Ready to turn insight into action?',
          desc: 'You can use research and data to make smarter decisions and build a plan that works towards a clear goal.',
          ask: 'What would you want to learn about your audience before launching a campaign?',
          color: '#00B8D9',
          ink: '#000054',
        },
        changemaker: {
          name: 'Changemaker',
          emoji: '⚡',
          image: '',
          value: 'Impact',
          power: 'Turn insight into meaningful, measurable results.',
          blurb:
            'You use marketing to tackle real-world challenges, aiming for campaigns that create positive change and results you can measure.',
          head: 'Ready to make a difference?',
          desc: 'You can use marketing to address real-world challenges and create positive change.',
          ask: 'What is one issue you could help tackle through a digital campaign?',
          color: '#FAC800',
          ink: '#000054',
        },
      };

      /* Each option is [student-facing text, persona key]. Options are shown as A–F in this order. */
      const QUESTIONS = [
        {
          title: 'Your marketing superpower',
          text: 'A brand gives you one day to create something amazing. What would you do first?',
          options: [
            ['Create an eye-catching TikTok video.', 'creator'],
            ['Study what customers really want.', 'strategist'],
            ['Start a conversation with the online community.', 'inclusive'],
            ['Try a completely new digital tool.', 'explorer'],
            ['Make sure the brand’s message is honest.', 'trust'],
            ['Find a way to make a positive difference.', 'changemaker'],
          ],
        },
        {
          title: 'Campaign challenge',
          text: 'Your brand’s TikTok campaign isn’t getting attention. What’s your next move?',
          options: [
            ['Ask followers what content they enjoy.', 'inclusive'],
            ['Experiment with an unusual campaign idea.', 'explorer'],
            ['Create a fun new video trend.', 'creator'],
            ['Set a clear goal and improve the results.', 'changemaker'],
            ['Check the views, clicks and engagement data.', 'strategist'],
            ['Check whether the message feels authentic.', 'trust'],
          ],
        },
        {
          title: 'Product launch',
          text: 'You are launching a new product for Gen Z. What excites you most?',
          options: [
            ['Making sure the product promises are truthful.', 'trust'],
            ['Designing the visuals and storytelling.', 'creator'],
            ['Creating a product launch with real social impact.', 'changemaker'],
            ['Building a community around the product.', 'inclusive'],
            ['Planning how to reach the right audience.', 'strategist'],
            ['Testing AI or interactive experiences.', 'explorer'],
          ],
        },
        {
          title: 'Online reputation',
          text: 'A brand receives negative comments online. What would you do?',
          options: [
            ['Explore a new way to solve the problem.', 'explorer'],
            ['Listen to customers and make everyone feel heard.', 'inclusive'],
            ['Make changes that improve customer experience.', 'changemaker'],
            ['Investigate the cause and plan a solution.', 'strategist'],
            ['Create a thoughtful response video.', 'creator'],
            ['Respond openly and honestly.', 'trust'],
          ],
        },
        {
          title: 'Your dream job',
          text: 'You join a digital marketing team. Which role sounds most exciting?',
          options: [
            ['Marketing impact and growth specialist.', 'changemaker'],
            ['Content creator and storyteller.', 'creator'],
            ['Brand trust and reputation specialist.', 'trust'],
            ['Digital innovation specialist.', 'explorer'],
            ['Social media community manager.', 'inclusive'],
            ['Campaign planner and data analyst.', 'strategist'],
          ],
        },
        {
          title: 'Success moment',
          text: 'Your campaign is a huge success! What makes you most proud?',
          options: [
            ['Customers genuinely trust our brand.', 'trust'],
            ['My campaign made a measurable difference.', 'changemaker'],
            ['I brought people together.', 'inclusive'],
            ['I introduced an exciting new idea.', 'explorer'],
            ['My strategy worked exactly as planned.', 'strategist'],
            ['People love and share my creative content.', 'creator'],
          ],
        },
      ];

      /* =========================================================
   STATE — nothing is stored in the browser, so a refresh or
   "Play again" always starts clean for the next student.
   ========================================================= */
      const state = {
        screen: 'welcome',
        answers: Array(QUESTIONS.length).fill(null),
        tied: [],
        tieChoice: null,
        winner: null,
        draft: '',
        name: '',
        posted: null,
        boardFrom: 'finish',
      };
      const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
      const stage = document.getElementById('stage');
      const progress = document.getElementById('progress');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let calcTimer = null;

      /* Scores are recalculated from the current answers every time,
   so changing an answer can never award a duplicate point. */
      function getScores() {
        const s = Object.fromEntries(Object.keys(PERSONAS).map((k) => [k, 0]));
        state.answers.forEach((a, i) => {
          if (a !== null) s[QUESTIONS[i].options[a][1]]++;
        });
        return s;
      }
      function topPersonas() {
        const s = getScores(),
          max = Math.max(...Object.values(s));
        return Object.keys(s).filter((k) => s[k] === max);
      }

      function resetGame() {
        clearTimeout(calcTimer);
        state.screen = 'welcome';
        state.answers = Array(QUESTIONS.length).fill(null);
        state.tied = [];
        state.tieChoice = null;
        state.winner = null;
        state.draft = '';
        state.name = '';
        state.posted = null;
        state.boardFrom = 'finish';
      }

      function go(screen) {
        state.screen = screen;
        render();
        window.scrollTo({ top: 0 });
      }

      /* =========================================================
   RENDER
   ========================================================= */
      function setAccent(key) {
        const r = document.documentElement.style;
        if (key) {
          r.setProperty('--accent', PERSONAS[key].color);
          r.setProperty('--accent-ink', PERSONAS[key].ink);
        } else {
          r.removeProperty('--accent');
          r.removeProperty('--accent-ink');
        }
      }

      function renderProgress() {
        const n = typeof state.screen === 'number' ? state.screen : null;
        if (n === null) {
          progress.hidden = true;
          return;
        }
        progress.hidden = false;
        progress.setAttribute('aria-label', `Question ${n + 1} of ${QUESTIONS.length}`);
        /* answered questions (and the current one) can be revisited by tapping their bar */
        progress.innerHTML = QUESTIONS.map((_, i) => {
          const cls = 'pstep ' + (i < n ? 'done' : i === n ? 'now' : '');
          const clickable = i !== n && state.answers[i] !== null;
          return clickable
            ? `<button type="button" class="${cls}" data-i="${i}" aria-label="Go back to question ${i + 1}"><i></i></button>`
            : `<span class="${cls}" ${i === n ? 'aria-current="step"' : ''}><i></i></span>`;
        }).join('');
        progress.querySelectorAll('button').forEach((b) => {
          b.onclick = () => go(Number(b.dataset.i));
        });
      }

      function iconHTML(key) {
        const p = PERSONAS[key];
        return p.image
          ? `<img src="${p.image}" alt="">`
          : `<span aria-hidden="true">${p.emoji}</span>`;
      }

      function render() {
        clearInterval(boardTimer);
        setAccent(null);
        renderProgress();
        const s = state.screen;
        if (s === 'welcome') renderWelcome();
        else if (typeof s === 'number') renderQuestion(s);
        else if (s === 'calc') renderCalc();
        else if (s === 'tie') renderTie();
        else if (s === 'result') renderResult();
        else if (s === 'finish') renderFinish();
        else if (s === 'board') renderBoard();
        animateIn();
      }

      function focusHeading() {
        const h = stage.querySelector('[data-focus]');
        if (h) {
          h.setAttribute('tabindex', '-1');
          h.focus({ preventScroll: true });
        }
      }

      function renderWelcome() {
        stage.innerHTML = `
    <div class="welcome">
      <div class="w-intro">
        <h1 data-focus>What’s your digital marketing superpower?</h1>
        <p class="lead">Discover your digital marketing strengths through six quick questions and reveal your persona.</p>
      </div>
      <div class="pwrap">
      <ul class="pgrid" tabindex="0" aria-label="The six digital marketing personas">
        ${Object.keys(PERSONAS)
          .map((k, n) => {
            const p = PERSONAS[k];
            return `
          <li class="pcard${n === 0 ? ' is-active' : ''}" style="--c:${p.color};--ink:${p.ink}">
            <div class="pic">${iconHTML(k)}</div>
            <h3>${p.name}</h3>
            <p>${p.blurb}</p>
          </li>`;
          })
          .join('')}
      </ul>
      <div class="pdots" aria-hidden="true">${Object.keys(PERSONAS)
        .map((_, n) => `<span class="${n === 0 ? 'on' : ''}"></span>`)
        .join('')}</div>
      <p class="swipe-hint" aria-hidden="true">Swipe to meet the six personas</p>
      </div>
      <div class="w-go">
        <p class="note">This is a fun discovery game, not a psychological or personality assessment. There are no right or wrong answers.</p>
        <div class="actions"><button class="btn" id="start">Discover my superpower →</button></div>
      </div>
    </div>`;
        document.getElementById('start').onclick = () => go(0);
        initGallery();
        focusHeading();
      }

      /* highlights the card in view and syncs the dots while swiping */
      function initGallery() {
        const g = stage.querySelector('.pgrid');
        if (!g) return;
        const cards = [...g.children],
          dots = [...stage.querySelectorAll('.pdots span')];
        let raf;
        const update = () => {
          if (getComputedStyle(g).display !== 'flex') return;
          const step = cards[1].offsetLeft - cards[0].offsetLeft;
          let i = Math.round(g.scrollLeft / step);
          if (g.scrollLeft + g.clientWidth >= g.scrollWidth - 4) i = cards.length - 1;
          i = Math.max(0, Math.min(cards.length - 1, i));
          cards.forEach((c, n) => c.classList.toggle('is-active', n === i));
          dots.forEach((d, n) => d.classList.toggle('on', n === i));
        };
        g.addEventListener(
          'scroll',
          () => {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(update);
          },
          { passive: true },
        );
        update();
      }

      /* staggered entrance for whatever the current screen contains */
      const ANIM_SEL =
        '.w-intro h1,.w-intro .lead,.pcard,.pdots,.swipe-hint,.w-go .note,.w-go .actions,.kicker,h2,.scenario,.opt,.lead,.actions,.hero,.action-box,.invite,.spinner,.big';
      function animateIn() {
        const all = [...stage.querySelectorAll(ANIM_SEL)];
        const els = all.filter((e) => !all.some((o) => o !== e && o.contains(e)));
        /* answer options count as one step, so they all appear together instead of one by one */
        let step = 0,
          optStep = null;
        els.forEach((e) => {
          let i;
          if (e.classList.contains('opt')) {
            if (optStep === null) optStep = step++;
            i = optStep;
          } else i = step++;
          e.style.setProperty('--i', Math.min(i, 10));
          e.classList.add('in');
        });
      }

      function renderQuestion(i) {
        const q = QUESTIONS[i],
          picked = state.answers[i];
        const last = i === QUESTIONS.length - 1;
        stage.innerHTML = `
    <span class="kicker">Question ${i + 1} of ${QUESTIONS.length}</span>
    <h2 data-focus>${q.title}</h2>
    <p class="scenario">${q.text}</p>
    <fieldset>
      <legend>${q.text}</legend>
      <div class="opts">
        ${q.options
          .map(
            (o, idx) => `
          <div class="opt">
            <input type="radio" name="q${i}" id="q${i}o${idx}" value="${idx}" ${picked === idx ? 'checked' : ''}>
            <label for="q${i}o${idx}"><span class="letter" aria-hidden="true">${LETTERS[idx]}</span><span>${o[0]}</span></label>
          </div>`,
          )
          .join('')}
      </div>
    </fieldset>
    <div class="actions">
      <button class="btn ghost" id="back">← Back</button>
      <button class="btn grow" id="next" ${picked === null ? 'disabled' : ''}>${last ? 'See my superpower →' : 'Next →'}</button>
    </div>`;
        const next = document.getElementById('next');
        stage.querySelectorAll('input[type=radio]').forEach((inp) => {
          inp.onchange = () => {
            state.answers[i] = Number(inp.value);
            next.disabled = false;
          };
        });
        document.getElementById('back').onclick = () => go(i === 0 ? 'welcome' : i - 1);
        next.onclick = () => {
          if (state.answers[i] === null) return;
          last ? finishQuiz() : go(i + 1);
        };
        focusHeading();
      }

      function finishQuiz() {
        state.tieChoice = null;
        go('calc');
      }

      function renderCalc() {
        stage.innerHTML = `
    <div class="calc">
      <div class="spinner" aria-hidden="true"></div>
      <h2 data-focus>Almost there!</h2>
      <p class="lead" style="margin-inline:auto">Your superpower is being revealed…</p>
    </div>`;
        focusHeading();
        calcTimer = setTimeout(
          () => {
            const top = topPersonas();
            if (top.length > 1) {
              state.tied = top;
              go('tie');
            } else {
              state.winner = top[0];
              go('result');
            }
          },
          reduceMotion ? 400 : 1600,
        );
      }

      function renderTie() {
        stage.innerHTML = `
    <div class="tie">
      <h2 data-focus>You’ve got more than one superpower!</h2>
      <p class="lead">Your answers show a tie. Which of these strengths feels more like you?</p>
      <fieldset>
        <legend>Choose one of the leading personas</legend>
        <div class="opts">
          ${state.tied
            .map(
              (k) => `
            <div class="opt">
              <input type="radio" name="tie" id="tie-${k}" value="${k}" ${state.tieChoice === k ? 'checked' : ''}>
              <label for="tie-${k}"><span class="letter" aria-hidden="true">${PERSONAS[k].emoji}</span><span>${PERSONAS[k].name}<br><small style="font-weight:400">${PERSONAS[k].power}</small></span></label>
            </div>`,
            )
            .join('')}
        </div>
      </fieldset>
      <div class="actions">
        <button class="btn ghost" id="back">← Back</button>
        <button class="btn grow" id="reveal" ${state.tieChoice ? '' : 'disabled'}>Reveal my superpower →</button>
      </div>
    </div>`;
        const btn = document.getElementById('reveal');
        stage.querySelectorAll('input[name=tie]').forEach((inp) => {
          inp.onchange = () => {
            state.tieChoice = inp.value;
            btn.disabled = false;
          };
        });
        document.getElementById('back').onclick = () => go(QUESTIONS.length - 1);
        btn.onclick = () => {
          if (!state.tieChoice) return;
          state.winner = state.tieChoice;
          go('result');
        };

      const boardIsAdmin = location.hash === '#admin';

      function esc(t) {
        return String(t).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      }

      function textProblem(t) {
        const v = t.trim();
        if (!v) return 'Write one action first.';
        if (v.length > BOARD.maxLen) return `Keep it under ${BOARD.maxLen} characters.`;
        if (/(https?:\/\/|www\.|\S+@\S+\.\S+|(\d[\s.\-]?){8,})/i.test(v))
          return 'Please leave out links, emails and phone numbers.';
        return '';
      }

      function nameProblem(n) {
        const v = n.trim();
        if (!v) return '';
        if (v.length > BOARD.maxName) return `Keep the name under ${BOARD.maxName} characters.`;
        if (/(https?:\/\/|www\.|\S+@\S+\.\S+|(\d[\s.\-]?){6,})/i.test(v))
          return 'Please use a nickname without links or contact details.';
        return '';
      }

      async function boardList() {
        if (!BOARD.endpoint) return demoPosts.slice();
        const r = await fetch(BOARD.endpoint + '/posts', { cache: 'no-store' });
        if (!r.ok) throw new Error('list failed');
        return (await r.json()).posts || [];
      }
      async function boardPost(persona, text, name) {
        if (!BOARD.endpoint) {
          const post = { id: 'local' + Date.now(), persona, text, name };
          demoPosts.unshift(post);
          return post;
        }
        let r;
        try {
          r = await fetch(BOARD.endpoint + '/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ persona, text, name }),
          });
        } catch (e) {
          throw new Error('Couldn’t reach the board. Check your connection and try again.');
        }
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || 'Couldn’t post. Please try again.');
        return data.post;
      }
      async function boardHide(id) {
        if (!BOARD.endpoint) {
          const i = demoPosts.findIndex((p) => String(p.id) === String(id));
          if (i > -1) demoPosts.splice(i, 1);
          return;
        }
        const r = await fetch(BOARD.endpoint + '/posts/' + encodeURIComponent(id), {
          method: 'DELETE',
          headers: { Authorization: 'Bearer ' + boardToken },
        });
        if (!r.ok)
          throw new Error(r.status === 401 ? 'Wrong admin token.' : 'Could not hide that post.');
      }
      /* admin: hide every post at once (rows stay in the database, just flagged hidden) */
      async function boardClearAll() {
        if (!BOARD.endpoint) {
          demoPosts.length = 0;
          return;
        }
        const r = await fetch(BOARD.endpoint + '/posts', {
          method: 'DELETE',
          headers: { Authorization: 'Bearer ' + boardToken },
        });
        if (!r.ok)
          throw new Error(
            r.status === 401
              ? 'Wrong admin token.'
              : r.status === 404 || r.status === 405
                ? 'The Worker does not support “clear board” yet. Update board-worker.js first.'
                : 'Could not clear the board.',
          );
      }

      function postBlockHTML() {
        if (state.posted)
          return `
    <div class="posted"><p><strong>You’re on the board!</strong> “${esc(state.posted.text)}”${state.posted.name ? ' — ' + esc(state.posted.name) : ''}</p></div>
    <div class="actions"><button class="btn" id="seeboard">See the board →</button><button class="btn ghost" id="cont">Continue →</button></div>`;
        return `
    <label class="next-step" for="stepText">My next step is to…</label>
    <textarea id="stepText" rows="3" maxlength="${BOARD.maxLen}" placeholder="Write one small, realistic action" autocomplete="off"></textarea>
    <div class="count"><span id="cnt">0</span>/${BOARD.maxLen}</div>
    <label class="field-label" for="stepName">Name your card (optional)</label>
    <input id="stepName" type="text" maxlength="${BOARD.maxName}" placeholder="A nickname, e.g. Mai" autocomplete="off">
    <p class="note">Your card goes on a shared board that everyone at Experience Day can see. Please use a nickname instead of your full name, and leave out links and contact details. Prefer pen and paper? Write it on a card at the booth instead.</p>
    <p class="note err" id="postMsg" role="status"></p>
    <div class="actions"><button class="btn" id="post" disabled>Post to the board</button><button class="btn ghost" id="cont">Skip →</button></div>`;
      }
      function wirePost() {
        document.getElementById('cont').onclick = () => go('finish');
        const sb = document.getElementById('seeboard');
        if (sb) sb.onclick = () => openBoard('result');
        const ta = document.getElementById('stepText');
        if (!ta) return;
        const btn = document.getElementById('post'),
          cnt = document.getElementById('cnt'),
          msg = document.getElementById('postMsg');
        const nm = document.getElementById('stepName');
        nm.value = state.name;
        nm.oninput = () => {
          state.name = nm.value;
          msg.textContent = '';
        };
        ta.value = state.draft;
        cnt.textContent = ta.value.length;
        btn.disabled = !ta.value.trim();
        ta.oninput = () => {
          state.draft = ta.value;
          cnt.textContent = ta.value.length;
          btn.disabled = !ta.value.trim();
          msg.textContent = '';
        };
        btn.onclick = async () => {
          const problem = textProblem(ta.value) || nameProblem(nm.value);
          if (problem) {
            msg.textContent = problem;
            return;
          }
          btn.disabled = true;
          msg.textContent = 'Posting…';
          try {
            state.posted = await boardPost(state.winner, ta.value.trim(), nm.value.trim());
            openBoard('result');
          } catch (e) {
            msg.textContent = e.message;
            btn.disabled = false;
          }
        };
      }

      function openBoard(from) {
        state.boardFrom = from;
        go('board');
      }

      function noteHTML(post, idx, isNew, first) {
        if (!PERSONAS[post.persona]) return '';
        const p = PERSONAS[post.persona],
          nm = (post.name || '').trim();
        const mine = state.posted && String(state.posted.id) === String(post.id);
        const bob = (-Math.random() * 7).toFixed(1);
        return `<article class="pnote${mine ? ' mine' : ''}${isNew ? ' float' : ''}${isNew && !first ? ' fresh' : ''}" data-id="${esc(post.id)}" style="--c:${p.color};--ink:${p.ink};--i:${idx};--b:${bob}s">
    <header><span class="pn-ic">${iconHTML(post.persona)}</span><span class="pn-t"><b>${nm ? esc(nm) : p.name}</b>${nm ? `<small>${p.name}</small>` : ''}</span>${mine ? '<em>You</em>' : ''}</header>
    <p>${esc(post.text)}</p>
    <div class="pn-v"><span class="pn-vl">RMIT Value: </span>${p.value}</div>
    ${boardIsAdmin ? `<button type="button" class="hide" data-id="${esc(post.id)}">Hide</button>` : ''}
  </article>`;
      }

      async function refreshBoard(first) {
        let el = document.getElementById('board');
        if (!el) return;
        const msg = document.getElementById('boardMsg');
        try {
          const posts = await boardList();
          el = document.getElementById('board');
          if (!el) return;
          const sig = posts.map((p) => p.id).join(',');
          if (sig !== boardSig || first) {
            boardSig = sig;
            const before = new Map(
              [...el.querySelectorAll('.pnote')].map((n) => [
                n.dataset.id,
                n.getBoundingClientRect(),
              ]),
            );
            el.innerHTML = posts.length
              ? posts
                  .map((p, i) =>
                    noteHTML(p, Math.min(i, 10), first ? true : !seenIds.has(String(p.id)), first),
                  )
                  .join('')
              : '<p class="empty">No posts yet. Be the first to share a next step!</p>';
            posts.forEach((p) => seenIds.add(String(p.id)));
            layoutKioskBoard();
            /* cards that were already there glide to their new spot instead of jumping */
            if (!first && !reduceMotion) {
              el.querySelectorAll('.pnote:not(.float)').forEach((n) => {
                const o = before.get(n.dataset.id);
                if (!o) return;
                const r = n.getBoundingClientRect(),
                  dx = o.left - r.left,
                  dy = o.top - r.top;
                if (dx || dy)
                  n.animate([{ translate: `${dx}px ${dy}px` }, { translate: '0 0' }], {
                    duration: 800,
                    easing: 'cubic-bezier(.2,.8,.2,1)',
                  });
              });
            }
          }
          msg.textContent = '';
        } catch (e) {
          if (msg) msg.textContent = 'Couldn’t load the board. Trying again…';
        }
      }

      function renderBoard() {
        const kiosk = document.body.classList.contains('kiosk'),
          from = state.boardFrom;
        boardSig = '';
        seenIds.clear();
        const joinUrl = (location.origin + location.pathname)
          .replace(/^https?:\/\//, '')
          .replace(/\/$/, '');
        const head = kiosk
          ? `<div class="khead">
         <div><p class="kbrand">RMIT Digital Marketing · Experience Day</p><h2 data-focus>My Digital Marketing Superpower: Powered by RMIT Values</h2><p class="lead">One small next step from everyone in the room.</p></div>
         <div class="kjoin"><div><b>${JOIN_QR ? 'Scan to play' : joinUrl}</b><span>${JOIN_QR ? 'Then add your own card to the board' : 'Play and add your card'}</span><p class="note" id="boardMsg" role="status"></p></div>${JOIN_QR ? `<img class="kqr" src="${JOIN_QR}" alt="QR code that opens the quiz">` : ''}</div>
       </div>`
          : `<h2 data-focus>My Digital Marketing Superpower: Powered by RMIT Values</h2><p class="lead">One small next step from everyone at Experience Day.</p>`;
        stage.innerHTML = `
    ${head}
    ${BOARD.endpoint ? '' : '<p class="note demo">Demo mode: posts are only visible on this device until the board is connected.</p>'}
    <div class="board" id="board" aria-live="polite"></div>
    ${kiosk ? '' : '<p class="note" id="boardMsg" role="status"></p>'}
    ${kiosk ? '' : `<div class="actions"><button class="btn ghost" id="bback">← Back</button>${from === 'result' ? '<button class="btn grow" id="bnext">Continue →</button>' : ''}</div>`}`;
        fitBoard();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBoard);
        if (!kiosk) {
          document.getElementById('bback').onclick = () => go(from);
          const nx = document.getElementById('bnext');
          if (nx) nx.onclick = () => go('finish');
        }
        document.getElementById('board').addEventListener('click', async (ev) => {
          const b = ev.target.closest('.hide');
          if (!b) return;
          if (!BOARD.endpoint || boardToken === null)
            boardToken = BOARD.endpoint ? window.prompt('Admin token') || null : 'demo';
          if (!boardToken) return;
          try {
            await boardHide(b.dataset.id);
            boardSig = '';
            refreshBoard(false);
          } catch (e) {
            alert(e.message);
            boardToken = null;
          }
        });
        refreshBoard(true);
        boardTimer = setInterval(
          () => {
            if (!document.hidden) refreshBoard(false);
          },
          kiosk ? BOARD.kioskPollMs : BOARD.pollMs,
        );
        focusHeading();
      }

      /* big-screen mode: use the fewest columns (biggest cards) that still show every post.
         Cards keep their natural height, so we try 4, 5, 6 ... columns until nothing spills over.
         If even the smallest readable size is not enough, the oldest cards are left off the screen
         (they stay on the board for students and in the database). */
      function layoutKioskBoard() {
        if (!document.body.classList.contains('kiosk')) return;
        const b = document.getElementById('board');
        if (!b) return;
        b.classList.add('measuring');
        try {
          fitKioskCards(b);
        } finally {
          b.classList.remove('measuring');
        }
      }
      function fitKioskCards(b) {
        const cards = [...b.querySelectorAll('.pnote')];
        cards.forEach((c) => (c.style.display = ''));
        if (!cards.length) {
          b.style.columnCount = 1; // empty message
          return;
        }
        const cs = getComputedStyle(b);
        const W = b.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        if (W <= 0) return;
        const gap = Math.max(8, Math.round(W * 0.007));
        b.style.setProperty('--gap', gap + 'px');
        // nothing spilled sideways into extra columns, or down past the bottom edge
        const fits = () =>
          b.scrollWidth <= b.clientWidth + 2 && b.scrollHeight <= b.clientHeight + 2;
        const setCols = (c) => {
          b.style.columnCount = c;
          b.style.setProperty('--cw', ((W - gap * (c - 1)) / c).toFixed(1) + 'px');
        };
        for (let c = 4; c <= BOARD.kioskMaxCols; c++) {
          setCols(c);
          if (fits()) return;
        }
        // still too many: show only the newest cards that fit (binary search on how many)
        const show = (k) => cards.forEach((card, i) => (card.style.display = i < k ? '' : 'none'));
        let lo = 1,
          hi = cards.length - 1;
        while (lo < hi) {
          const mid = Math.ceil((lo + hi) / 2);
          show(mid);
          if (fits()) lo = mid;
          else hi = mid - 1;
        }
        show(lo);
      }

      /* Slow flight through a starfield tunnel. Stars sit on a cylinder around the flight path;
         each one drifts toward the camera, grows, glows brighter, leaves the screen, and is
         reborn far away, so the loop never has a visible seam. */
      function startStarfield(canvas) {
        const ctx = canvas.getContext('2d');
        if (!ctx) return; // no canvas support: the plain black background stays
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // one soft white glow sprite, reused for every star
        const sprite = document.createElement('canvas');
        sprite.width = sprite.height = 64;
        const sg = sprite.getContext('2d');
        const grad = sg.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.12, 'rgba(255,255,255,0.9)');
        grad.addColorStop(0.3, 'rgba(225,232,255,0.34)');
        grad.addColorStop(1, 'rgba(200,215,255,0)');
        sg.fillStyle = grad;
        sg.fillRect(0, 0, 64, 64);

        let W = 0,
          H = 0,
          focal = 1,
          stars = [];

        function spawn(anywhere) {
          return {
            a: Math.random() * Math.PI * 2, // angle around the tunnel
            r: 0.04 + Math.sqrt(Math.random()) * 1.15, // distance from the flight path
            z: anywhere ? 0.04 + Math.random() * 0.96 : 1, // 1 = far away, 0 = at the camera
            size: 0.003 + Math.random() * 0.005,
            tw: 0.6 + Math.random() * 1.8, // twinkle speed
            ph: Math.random() * 6.28,
          };
        }

        function resize() {
          // draw at no more than ~1080p; the glow is soft so it still looks sharp on a 4K TV
          const scale = Math.min(1, 1920 / window.innerWidth);
          W = canvas.width = Math.round(window.innerWidth * scale);
          H = canvas.height = Math.round(window.innerHeight * scale);
          focal = Math.max(W, H) * 0.55;
          const n = Math.round(Math.min(2200, Math.max(700, (W * H) / 1200)) * STARFIELD.density);
          stars = Array.from({ length: n }, () => spawn(true));
        }

        function draw(t, dt) {
          const cx = W / 2 + Math.sin(t * 0.07) * W * 0.02; // gentle camera sway
          const cy = H / 2 + Math.cos(t * 0.05) * H * 0.02;
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, W, H);
          // faint glow at the far end of the tunnel
          const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.5);
          g.addColorStop(0, 'rgba(210,220,255,0.07)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);

          ctx.globalCompositeOperation = 'lighter';
          for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            s.z -= STARFIELD.speed * dt;
            s.a += STARFIELD.rotation * dt;
            const sx = cx + ((s.r * Math.cos(s.a)) / s.z) * focal;
            const sy = cy + ((s.r * Math.sin(s.a)) / s.z) * focal;
            if (s.z < 0.03 || sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) {
              stars[i] = spawn(false);
              continue;
            }
            const d = Math.min(46, Math.max(2.5, (s.size * focal) / s.z)); // glow diameter in px
            let alpha = Math.min(1, (1 - s.z) / 0.12); // fade in from the distance
            alpha *= 0.75 + 0.25 * Math.sin(t * s.tw + s.ph); // twinkle
            if (alpha <= 0.02) continue;
            if (d > 14) {
              // short trail on the closest stars gives a feeling of motion
              const z2 = s.z + STARFIELD.speed * 1.2;
              const px = cx + ((s.r * Math.cos(s.a)) / z2) * focal;
              const py = cy + ((s.r * Math.sin(s.a)) / z2) * focal;
              ctx.strokeStyle = 'rgba(255,255,255,' + (alpha * 0.35).toFixed(3) + ')';
              ctx.lineWidth = Math.max(1, d * 0.07);
              ctx.beginPath();
              ctx.moveTo(px, py);
              ctx.lineTo(sx, sy);
              ctx.stroke();
            }
            ctx.globalAlpha = alpha;
            ctx.drawImage(sprite, sx - d / 2, sy - d / 2, d, d);
          }
          ctx.globalAlpha = 1;
        }

        resize();
        let resizeTimer;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            resize();
            if (reduce) draw(0, 0);
          }, 200);
        });

        if (reduce) {
          draw(0, 0); // still image for people who prefer reduced motion
          return;
        }
        let last = performance.now();
        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          draw(now / 1000, dt);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      /* big-screen mode: the board fills the rest of the screen (no scrolling), newest cards first */
      function fitBoard() {
        if (!document.body.classList.contains('kiosk')) return;
        const b = document.getElementById('board');
        if (!b) return;
        const shell = document.querySelector('.shell');
        const pad = parseFloat(getComputedStyle(shell).paddingBottom) || 0;
        b.style.height =
          Math.max(240, window.innerHeight - b.getBoundingClientRect().top - pad) + 'px';
        layoutKioskBoard();
      }
      function initKiosk() {
        const bg = document.createElement('div');
        bg.className = 'kbg';
        bg.setAttribute('aria-hidden', 'true');
        const cv = document.createElement('canvas');
        bg.appendChild(cv);
        document.body.prepend(bg);
        try {
          startStarfield(cv);
        } catch (e) {
          /* the board still works on a plain black background */
        }
        window.addEventListener('resize', fitBoard);
        /* full screen (hides the browser's tab bar): button, F key, or double-click */
        const toggleFullscreen = () => {
          if (document.fullscreenElement) document.exitFullscreen();
          else if (document.documentElement.requestFullscreen)
            document.documentElement.requestFullscreen();
        };
        const fsBtn = document.createElement('button');
        fsBtn.type = 'button';
        fsBtn.className = 'kfs';
        fsBtn.textContent = 'Full screen';
        fsBtn.hidden = !document.documentElement.requestFullscreen;
        fsBtn.onclick = toggleFullscreen;
        document.body.appendChild(fsBtn);
        /* admin only: red "Clear board" button (bottom left) */
        if (boardIsAdmin) {
          const clr = document.createElement('button');
          clr.type = 'button';
          clr.className = 'kclear';
          clr.textContent = 'Clear board';
          clr.onclick = async () => {
            const n = document.querySelectorAll('#board .pnote').length;
            if (
              !window.confirm(
                'Hide ALL posts from the board' +
                  (n ? ' (' + n + ' showing now)' : '') +
                  '?\n\nThey stay in the database but disappear from every screen.',
              )
            )
              return;
            if (!BOARD.endpoint || boardToken === null)
              boardToken = BOARD.endpoint ? window.prompt('Admin token') || null : 'demo';
            if (!boardToken) return;
            try {
              await boardClearAll();
              boardSig = '';
              seenIds.clear();
              refreshBoard(false);
            } catch (e) {
              alert(e.message);
              boardToken = null;
            }
          };
          document.body.appendChild(clr);
        }
        document.addEventListener('fullscreenchange', () => {
          fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'f' || e.key === 'F') toggleFullscreen();
        });
        document.addEventListener('dblclick', (e) => {
          if (!e.target.closest('.hide, .kclear')) toggleFullscreen();
        });
        /* hide the mouse pointer after 3 seconds (not in admin mode) */
        if (!boardIsAdmin) {
          let t;
          const wake = () => {
            document.body.classList.remove('idle');
            clearTimeout(t);
            t = setTimeout(() => document.body.classList.add('idle'), 3000);
          };
          document.addEventListener('mousemove', wake);
          wake();
        }
        /* keep the TV awake where the browser allows it */
        const keepAwake = () => {
          try {
            if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
          } catch (e) {}
        };
        keepAwake();
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) keepAwake();
        });
      }

      /* =========================================================
   SAVE PERSONA AS IMAGE (drawn on a canvas, no libraries)
   ========================================================= */
      function wrapText(ctx, text, x, y, maxW, lh) {
        const words = text.split(' ');
        let line = '';
        for (const w of words) {
          const test = line ? line + ' ' + w : w;
          if (ctx.measureText(test).width > maxW && line) {
            ctx.fillText(line, x, y);
            line = w;
            y += lh;
          } else line = test;
        }
        if (line) {
          ctx.fillText(line, x, y);
          y += lh;
        }
        return y;
      }
      function loadImg(src) {
        return new Promise((res) => {
          const im = new Image();
          im.crossOrigin = 'anonymous';
          im.onload = () => res(im);
          im.onerror = () => res(null);
          im.src = src;
        });
      }

      async function buildCard(key) {
        const p = PERSONAS[key],
          W = 1080,
          H = 1350;
        try {
          await Promise.all([
            document.fonts.load('900 60px Lato'),
            document.fonts.load('700 40px Lato'),
          ]);
        } catch (e) {}
        const c = document.createElement('canvas');
        c.width = W;
        c.height = H;
        const ctx = c.getContext('2d');
        const F = 'Lato, system-ui, Arial, sans-serif';

        ctx.fillStyle = '#000054';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.roundRect(60, 60, W - 120, H - 120, 56);
        ctx.fill();

        ctx.textAlign = 'center';
        ctx.fillStyle = p.ink;
        ctx.font = `700 38px ${F}`;
        ctx.fillText('My digital marketing persona is…', W / 2, 150);

        // icon circle
        const cx = W / 2,
          cy = 430,
          r = 200;
        ctx.fillStyle = 'rgba(255,255,255,.93)';
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        let drawn = false;
        if (p.image) {
          const im = await loadImg(p.image);
          if (im) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(im, cx - r, cy - r, r * 2, r * 2);
            ctx.restore();
            drawn = true;
          }
        }
        if (!drawn) {
          ctx.font = `220px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#000';
          ctx.fillText(p.emoji, cx, cy + 14);
          ctx.textBaseline = 'alphabetic';
        }

        ctx.fillStyle = p.ink;
        ctx.font = `900 108px ${F}`;
        let nameSize = 108;
        while (ctx.measureText(p.name).width > W - 220 && nameSize > 60) {
          nameSize -= 4;
          ctx.font = `900 ${nameSize}px ${F}`;
        }
        ctx.fillText(p.name, W / 2, 760);

        // value pill
        ctx.font = `900 40px ${F}`;
        const label = 'RMIT Value: ' + p.value,
          tw = ctx.measureText(label).width + 70;
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        ctx.beginPath();
        ctx.roundRect(W / 2 - tw / 2, 800, tw, 70, 35);
        ctx.fill();
        ctx.fillStyle = '#000054';
        ctx.fillText(label, W / 2, 849);

        ctx.fillStyle = p.ink;
        ctx.font = `700 52px ${F}`;
        wrapText(ctx, p.power, W / 2, 980, W - 260, 66);

        ctx.font = `700 32px ${F}`;
        ctx.globalAlpha = 0.9;
        ctx.fillText('What’s your digital marketing superpower?', W / 2, H - 130);
        ctx.globalAlpha = 1;
        return c;
      }

      async function savePersona() {
        const msg = document.getElementById('saveMsg'),
          btn = document.getElementById('save');
        btn.disabled = true;
        msg.textContent = 'Getting your persona ready…';
        try {
          const canvas = await buildCard(state.winner);
          const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
          const fname = `my-digital-marketing-superpower-${state.winner}.png`;
          const file = new File([blob], fname, { type: 'image/png' });
          const touch = window.matchMedia('(pointer: coarse)').matches;
          if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({ files: [file], title: 'My digital marketing superpower' });
              msg.textContent = 'Shared! You can also save it to your photos.';
            } catch (e) {
              msg.textContent =
                e && e.name === 'AbortError' ? '' : 'Could not open sharing. Try again.';
            }
          } else {
            const url = URL.createObjectURL(blob),
              a = document.createElement('a');
            a.href = url;
            a.download = fname;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
            msg.textContent = 'Saved! Check your downloads.';
          }
        } catch (e) {
          msg.textContent = 'Sorry, saving didn’t work. Try a screenshot instead.';
        }
        btn.disabled = false;
      }

      if (location.hash === '#board' || location.hash === '#admin') {
        document.body.classList.add('kiosk');
        document.documentElement.classList.add('kiosk');
        state.screen = 'board';
        initKiosk();
      }
      render();
    </script>
  </body>
</html>
